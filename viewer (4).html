<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>상세페이지 검토 결과</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', 'Apple SD Gothic Neo', sans-serif; background: #f0f2f5; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

    header { background: #1a1a2e; color: #fff; padding: 0 24px; height: 52px; display: flex; align-items: center; gap: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.4); flex-shrink: 0; }
    .hdr-title { font-size: 1rem; font-weight: 700; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .badge { background: #e53e3e; color: #fff; font-size: .68rem; padding: 2px 8px; border-radius: 20px; font-weight: 600; white-space: nowrap; }
    .round-tabs { display: flex; gap: 4px; }
    .round-tab { padding: 5px 14px; font-size: .82rem; font-weight: 600; border-radius: 6px; cursor: pointer; border: 1px solid rgba(255,255,255,.25); background: rgba(255,255,255,.08); color: rgba(255,255,255,.7); transition: all .15s; }
    .round-tab.active { background: #5b8af5; border-color: #5b8af5; color: #fff; }
    .round-tab:disabled { opacity: .35; cursor: default; }
    .confirmed-badge { background: #5b8af5; color: #fff; font-size: .7rem; padding: 3px 10px; border-radius: 20px; font-weight: 700; white-space: nowrap; }
    .page-nav { display: flex; align-items: center; gap: 5px; }
    .page-nav-btn { background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.2); color: #fff; width: 28px; height: 28px; border-radius: 5px; cursor: pointer; font-size: 13px; display: flex; align-items: center; justify-content: center; transition: background .15s; }
    .page-nav-btn:hover:not(:disabled) { background: rgba(255,255,255,.22); }
    .page-nav-btn:disabled { opacity: .35; cursor: default; }
    .page-label { font-size: .78rem; color: rgba(255,255,255,.7); white-space: nowrap; min-width: 48px; text-align: center; }

    #thumb-strip { display: flex; gap: 6px; overflow-x: auto; padding: 8px 16px; background: #111827; border-bottom: 1px solid #2d3748; flex-shrink: 0; }
    .thumb-item { width: 44px; height: 56px; border-radius: 4px; border: 2px solid #374151; overflow: hidden; cursor: pointer; flex-shrink: 0; position: relative; background: #1f2937; transition: border-color .15s; }
    .thumb-item.active { border-color: #5b8af5; }
    .thumb-item img { width: 100%; height: 100%; object-fit: cover; }
    .thumb-item .t-num { position: absolute; bottom: 2px; right: 3px; font-size: 9px; font-weight: 700; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.8); }

    #main { display: flex; flex: 1; overflow: hidden; }

    #canvas-area { flex: 1; overflow: auto; padding: 24px; background: #e8ecf0; display: flex; justify-content: center; align-items: flex-start; }
    #image-wrapper { position: relative; display: none; box-shadow: 0 4px 24px rgba(0,0,0,.18); border-radius: 4px; overflow: hidden; line-height: 0; }
    #bg-image { display: block; max-width: 100%; user-select: none; pointer-events: none; }
    #draw-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; cursor: pointer; }

    #sidebar { width: 300px; min-width: 260px; background: #f8f9fa; border-left: 1px solid #e2e8f0; display: flex; flex-direction: column; overflow: hidden; flex-shrink: 0; }
    #sidebar-header { padding: 12px 14px; background: #fff; border-bottom: 1px solid #e2e8f0; font-size: .85rem; font-weight: 700; color: #2d3748; display: flex; justify-content: space-between; align-items: center; }
    #annotation-count { font-size: .75rem; color: #718096; font-weight: 400; }
    #comment-list { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 9px; }
    #comment-list:empty::after { content: '이 차수에 주석이 없습니다.'; display: block; text-align: center; color: #a0aec0; font-size: .78rem; margin-top: 40px; }
    .comment-card { background: #fff; border-radius: 8px; border-left: 4px solid #ccc; padding: 10px 12px; box-shadow: 0 1px 4px rgba(0,0,0,.06); transition: all .15s; cursor: pointer; }
    .comment-card:hover, .comment-card.highlighted { box-shadow: 0 3px 12px rgba(0,0,0,.12); transform: translateX(2px); }
    .comment-card.highlighted { background: #fffbe6; }
    .card-top { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .card-num { width: 20px; height: 20px; border-radius: 50%; background: #1a1a2e; color: #fff; font-size: .68rem; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .card-color-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
    .card-label { font-size: .78rem; font-weight: 600; color: #2d3748; flex: 1; }
    .card-comment { font-size: .76rem; color: #4a5568; line-height: 1.55; white-space: pre-wrap; background: #f8f9fa; padding: 6px 8px; border-radius: 5px; border: 1px solid #e2e8f0; min-height: 32px; }
    .card-comment:empty::after { content: '(의견 없음)'; color: #cbd5e0; }

    #loading, #error-msg { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; flex: 1; color: #718096; }
    .spinner { width: 38px; height: 38px; border: 3px solid #e2e8f0; border-top-color: #1a1a2e; border-radius: 50%; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    #error-msg { color: #e53e3e; font-size: .9rem; }

    .round-empty { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; color: #a0aec0; padding: 60px 20px; text-align: center; }
  </style>
</head>
<body>

<header>
  <span class="hdr-title" id="hdr-title">상세페이지 검토 결과</span>
  <span class="badge">읽기 전용</span>
  <div class="round-tabs" id="round-tabs" style="display:none">
    <button class="round-tab active" id="viewRoundTab1">1차</button>
    <button class="round-tab" id="viewRoundTab2">2차</button>
  </div>
  <div class="page-nav" id="page-nav" style="display:none">
    <button class="page-nav-btn" id="btnPrev" disabled>◀</button>
    <span class="page-label" id="pageLabel">1 / 1</span>
    <button class="page-nav-btn" id="btnNext" disabled>▶</button>
  </div>
</header>
<div id="thumb-strip" style="display:none"></div>

<div id="main">
  <div id="canvas-area">
    <div id="loading"><div class="spinner"></div><span>불러오는 중...</span></div>
    <div id="error-msg" style="display:none"><span>⚠️</span><span id="error-text">존재하지 않거나 만료된 링크입니다.</span></div>
    <div id="image-wrapper">
      <img id="bg-image" alt="상세페이지" draggable="false" />
      <canvas id="draw-canvas"></canvas>
    </div>
  </div>
  <div id="sidebar">
    <div id="sidebar-header">주석 목록 <span id="annotation-count">0개</span></div>
    <div id="comment-list"></div>
  </div>
</div>

<script>
(() => {
  const isProduct = location.pathname.startsWith('/view/product/');
  const id = location.pathname.split('/').pop();

  const bgImage     = document.getElementById('bg-image');
  const drawCanvas  = document.getElementById('draw-canvas');
  const ctx         = drawCanvas.getContext('2d');
  const imageWrapper = document.getElementById('image-wrapper');
  const commentList = document.getElementById('comment-list');
  const annotCount  = document.getElementById('annotation-count');
  const loading     = document.getElementById('loading');
  const errorMsg    = document.getElementById('error-msg');
  const errorText   = document.getElementById('error-text');
  const thumbStrip  = document.getElementById('thumb-strip');
  const roundTabsEl = document.getElementById('round-tabs');
  const pageNavEl   = document.getElementById('page-nav');
  const pageLabel   = document.getElementById('pageLabel');
  const btnPrev     = document.getElementById('btnPrev');
  const btnNext     = document.getElementById('btnNext');

  let roundData = { 1: [], 2: [] }; // pages arrays
  let currentRound = 1;
  let pages = [];
  let currentPageIdx = 0;
  let annotations = [];
  let hoveredId = null;

  // ── Load ──
  const apiUrl = isProduct ? `/api/products/${id}` : `/api/view/${id}`;
  fetch(apiUrl)
    .then(r => r.ok ? r.json() : r.json().then(d => Promise.reject(d.error || '알 수 없는 오류')))
    .then(data => {
      if (isProduct) {
        // Product: { name, rounds: { 1: {pages}, 2: {pages} } }
        document.getElementById('hdr-title').textContent = '🖼 ' + (data.name || '검토 결과');
        document.title = data.name || '검토 결과';
        roundData[1] = (data.rounds && data.rounds[1] && data.rounds[1].pages) || [];
        roundData[2] = (data.rounds && data.rounds[2] && data.rounds[2].pages) || [];
        roundData.completed = {
          1: !!(data.rounds && data.rounds[1] && data.rounds[1].completed),
          2: !!(data.rounds && data.rounds[2] && data.rounds[2].completed)
        };

        // Show round tabs only if at least one round has data
        const hasData = roundData[1].length > 0 || roundData[2].length > 0;
        if (!hasData) { showError('아직 등록된 주석이 없습니다.'); return; }
        roundTabsEl.style.display = 'flex';

        // Disable tab if no data for that round
        document.getElementById('viewRoundTab1').disabled = roundData[1].length === 0;
        document.getElementById('viewRoundTab2').disabled = roundData[2].length === 0;

        document.getElementById('viewRoundTab1').addEventListener('click', () => switchRound(1));
        document.getElementById('viewRoundTab2').addEventListener('click', () => switchRound(2));

        // Start with whichever round has data
        const startRound = roundData[1].length > 0 ? 1 : 2;
        switchRound(startRound);
      } else {
        // Legacy share: { imageDataUrl, annotations } or { pages }
        loading.style.display = 'none';
        let legacyPages;
        if (Array.isArray(data.pages)) {
          legacyPages = data.pages;
        } else {
          legacyPages = [{ imageDataUrl: data.imageDataUrl, annotations: data.annotations || [] }];
        }
        roundData[1] = legacyPages;
        switchRound(1);
      }
    })
    .catch(err => showError(typeof err === 'string' ? err : (err.message || '불러오기 실패')));

  function showError(msg) {
    loading.style.display = 'none';
    errorText.textContent = msg;
    errorMsg.style.display = 'flex';
  }

  function switchRound(round) {
    currentRound = round;
    if (isProduct) {
      document.getElementById('viewRoundTab1').classList.toggle('active', round === 1);
      document.getElementById('viewRoundTab2').classList.toggle('active', round === 2);
      // 확인 완료 배지 표시
      var existing = document.getElementById('confirmed-badge');
      if (existing) existing.remove();
      if (roundData.completed && roundData.completed[round]) {
        var badge = document.createElement('span');
        badge.id = 'confirmed-badge';
        badge.className = 'confirmed-badge';
        badge.textContent = '✅ 확인 완료';
        document.getElementById('round-tabs').after(badge);
      }
    }
    pages = roundData[round] || [];
    if (pages.length === 0) {
      loading.style.display = 'none';
      imageWrapper.style.display = 'none';
      annotations = [];
      buildSidebar();
      buildPageNav();
      buildThumbStrip();
      // show empty state in canvas area
      const existing = document.getElementById('round-empty');
      if (existing) existing.remove();
      const emp = document.createElement('div');
      emp.id = 'round-empty';
      emp.className = 'round-empty';
      emp.innerHTML = '<div style="font-size:40px">📭</div><div>' + (round === 1 ? '1차' : '2차') + ' 등록된 내용이 없습니다.</div>';
      document.getElementById('canvas-area').appendChild(emp);
      return;
    }
    const existing = document.getElementById('round-empty');
    if (existing) existing.remove();
    currentPageIdx = 0;
    loadPage(0);
    buildThumbStrip();
  }

  function loadPage(idx) {
    currentPageIdx = idx;
    annotations = (pages[idx].annotations || []).slice();
    const canvasArea = document.getElementById('canvas-area');
    bgImage.onload = () => {
      loading.style.display = 'none';
      imageWrapper.style.display = 'inline-block';
      requestAnimationFrame(() => requestAnimationFrame(() => {
        syncCanvas(); render(); buildSidebar(); buildPageNav(); updateThumbActive();
      }));
    };
    bgImage.onerror = () => showError('이미지를 불러올 수 없습니다.');
    bgImage.src = pages[idx].imageDataUrl;
  }

  function buildPageNav() {
    pageNavEl.style.display = pages.length > 1 ? 'flex' : 'none';
    pageLabel.textContent = (currentPageIdx + 1) + ' / ' + pages.length;
    btnPrev.disabled = currentPageIdx <= 0;
    btnNext.disabled = currentPageIdx >= pages.length - 1;
  }

  function buildThumbStrip() {
    if (pages.length <= 1) { thumbStrip.style.display = 'none'; return; }
    thumbStrip.style.display = 'flex';
    thumbStrip.innerHTML = '';
    pages.forEach((p, i) => {
      const item = document.createElement('div');
      item.className = 'thumb-item' + (i === currentPageIdx ? ' active' : '');
      const img = document.createElement('img'); img.src = p.imageDataUrl;
      const num = document.createElement('span'); num.className = 't-num'; num.textContent = i + 1;
      item.appendChild(img); item.appendChild(num);
      item.addEventListener('click', () => loadPage(i));
      thumbStrip.appendChild(item);
    });
  }

  function updateThumbActive() {
    document.querySelectorAll('.thumb-item').forEach((el, i) => el.classList.toggle('active', i === currentPageIdx));
  }

  btnPrev.addEventListener('click', () => { if (currentPageIdx > 0) loadPage(currentPageIdx - 1); });
  btnNext.addEventListener('click', () => { if (currentPageIdx < pages.length - 1) loadPage(currentPageIdx + 1); });

  // ── Canvas ──
  function syncCanvas() {
    drawCanvas.width = bgImage.offsetWidth;
    drawCanvas.height = bgImage.offsetHeight;
  }
  window.addEventListener('resize', () => { if (imageWrapper.style.display !== 'none') { syncCanvas(); render(); } });

  function render() {
    const cw = drawCanvas.width, ch = drawCanvas.height;
    ctx.clearRect(0, 0, cw, ch);
    annotations.forEach(a => drawBox(a, cw, ch, a.id === hoveredId));
  }

  function drawBox(a, cw, ch, hl) {
    const rx = a.x*cw, ry = a.y*ch, rw = a.width*cw, rh = a.height*ch;
    ctx.save();
    ctx.fillStyle = a.color; ctx.globalAlpha = hl ? .18 : .10;
    ctx.fillRect(rx, ry, rw, rh);
    ctx.globalAlpha = 1; ctx.strokeStyle = a.color;
    ctx.lineWidth = hl ? 3 : 2; ctx.setLineDash([]);
    ctx.strokeRect(rx, ry, rw, rh);
    const bs = 20, bx = rx+2, by = ry-bs-2 < 0 ? ry+2 : ry-bs-2;
    ctx.fillStyle = a.color;
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(bx, by, bs, bs, 4); else ctx.rect(bx, by, bs, bs);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.font = `bold ${Math.round(bs*.6)}px sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(String(a.number), bx+bs/2, by+bs/2);
    ctx.restore();
  }

  drawCanvas.addEventListener('mousemove', e => {
    const rect = drawCanvas.getBoundingClientRect();
    const mx = e.clientX - rect.left, my = e.clientY - rect.top;
    const cw = drawCanvas.width, ch = drawCanvas.height;
    let found = null;
    for (let i = annotations.length - 1; i >= 0; i--) {
      const a = annotations[i];
      if (mx >= a.x*cw && mx <= (a.x+a.width)*cw && my >= a.y*ch && my <= (a.y+a.height)*ch) { found = a.id; break; }
    }
    drawCanvas.style.cursor = found ? 'pointer' : 'default';
    if (found !== hoveredId) { hoveredId = found; render(); updateHover(); }
  });
  drawCanvas.addEventListener('mouseleave', () => { hoveredId = null; render(); updateHover(); });
  drawCanvas.addEventListener('click', e => {
    const rect = drawCanvas.getBoundingClientRect();
    const mx = e.clientX - rect.left, my = e.clientY - rect.top;
    const cw = drawCanvas.width, ch = drawCanvas.height;
    for (let i = annotations.length - 1; i >= 0; i--) {
      const a = annotations[i];
      if (mx >= a.x*cw && mx <= (a.x+a.width)*cw && my >= a.y*ch && my <= (a.y+a.height)*ch) {
        const card = document.querySelector(`.comment-card[data-id="${a.id}"]`);
        if (card) { card.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); card.classList.add('highlighted'); setTimeout(() => card.classList.remove('highlighted'), 1500); }
        break;
      }
    }
  });

  // ── Sidebar ──
  function buildSidebar() {
    commentList.innerHTML = '';
    annotations.forEach(a => {
      const card = document.createElement('div');
      card.className = 'comment-card'; card.dataset.id = a.id;
      card.style.borderLeftColor = a.color;
      const commentHtml = a.comment
        ? `<div class="card-comment">${(a.comment||'').replace(/</g,'&lt;')}</div>`
        : `<div class="card-comment"></div>`;
      card.innerHTML = `
        <div class="card-top">
          <div class="card-num" style="background:${a.color}">${a.number}</div>
          <div class="card-color-dot" style="background:${a.color}"></div>
          <div class="card-label">주석 #${a.number}</div>
        </div>${commentHtml}`;
      card.addEventListener('mouseenter', () => { hoveredId = a.id; render(); updateHover(); });
      card.addEventListener('mouseleave', () => { hoveredId = null; render(); updateHover(); });
      card.addEventListener('click', () => scrollToAnnot(a));
      commentList.appendChild(card);
    });
    annotCount.textContent = annotations.length + '개';
  }

  function updateHover() {
    document.querySelectorAll('.comment-card').forEach(c =>
      c.classList.toggle('highlighted', Number(c.dataset.id) === hoveredId));
  }

  function scrollToAnnot(a) {
    const ch = drawCanvas.height;
    const boxCY = (a.y + a.height/2) * ch;
    const area = document.getElementById('canvas-area');
    const wt = imageWrapper.getBoundingClientRect().top - area.getBoundingClientRect().top + area.scrollTop;
    area.scrollTo({ top: wt + boxCY - area.clientHeight/2, behavior: 'smooth' });
    hoveredId = a.id; render();
    setTimeout(() => { hoveredId = null; render(); }, 1200);
  }

  // sidebar scroll sync
  let scrollTimer;
  document.getElementById('canvas-area').addEventListener('scroll', () => {
    clearTimeout(scrollTimer);
    scrollTimer = setTimeout(() => {
      if (!annotations.length) return;
      const ch = drawCanvas.height;
      const area = document.getElementById('canvas-area');
      const wt = imageWrapper.getBoundingClientRect().top - area.getBoundingClientRect().top + area.scrollTop;
      const midY = area.scrollTop + area.clientHeight/2 - wt;
      let closest = null, minD = Infinity;
      annotations.forEach(a => {
        const d = Math.abs((a.y + a.height/2)*ch - midY);
        if (d < minD) { minD = d; closest = a; }
      });
      if (closest) {
        const card = document.querySelector(`.comment-card[data-id="${closest.id}"]`);
        if (card) card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }
    }, 150);
  });
})();
</script>
</body>
</html>
